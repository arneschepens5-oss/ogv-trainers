<style>
:root{--bg:#F3F3EE;--card:#fff;--card2:#F7F7F2;--ink:#121311;--muted:#5D5F56;--line:#E2E2DA;--yellow:#FFD100;--ok:#15803D;--bad:#C2261D}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Archivo",system-ui,-apple-system,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px calc(12px);padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:#fff}

header b{font-weight:900;font-size:18px;font-stretch:110%}header small{display:block;color:#bdbdb4;font-size:12.5px}
header .sp{flex:1}header button{all:unset;cursor:pointer;font-size:13px;color:#d8d8cf;padding:6px 8px}
main{max-width:620px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px 6px;margin-bottom:12px;box-shadow:0 1px 2px rgba(18,19,17,.04)}

label{display:block;font-size:14px;font-weight:700;color:#3D3F38;margin-bottom:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.seg button{all:unset;cursor:pointer;text-align:center;padding:12px 6px;border-radius:12px;border:1.5px solid #D9D9D0;background:#fff;font-weight:700;font-size:15px}.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

input,select,textarea{display:block;width:100%;min-width:0;margin-top:6px;padding:12px 14px;min-height:50px;border:1.5px solid #D9D9D0;border-radius:12px;background:#fff;font-size:16px;font-weight:500;color:var(--ink);-webkit-appearance:none;appearance:none}

.hint{font-size:13px;color:var(--muted);margin:6px 0 0}

.crit input[type=range]{--p:50%;--f:#FFD100;display:block;width:100%;height:34px;margin:6px 0 2px;padding:0;border:0;background:none;box-shadow:none;min-height:0;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:pan-y}

.pitch:before{content:"";position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid #fff6;border-radius:50%}
.pitch:after{content:"";position:absolute;left:7px;right:7px;top:50%;border-top:2px solid #fff6}

.btn{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 18px;border-radius:14px;background:var(--yellow);color:#121311;font-weight:900;font-size:16.5px;text-align:center}

.list{margin:0;padding:0;list-style:none}.list li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}.list li:first-child{border-top:0}.list small{color:var(--muted)}
.center{max-width:420px;margin:8vh auto 0}
[hidden]{display:none!important}

header{background:radial-gradient(360px 160px at 90% -40px,color-mix(in srgb,var(--yellow) 32%,transparent),transparent 70%),linear-gradient(180deg,#151613,#0E0F0C);box-shadow:0 10px 24px -18px rgba(0,0,0,.6)}

<script>
/* club van de scoutlink (?c=...): logo, naam en kleur van die club, ook al voor het aanmelden en op het beginscherm */
const BFN = "https://intswyovpwiigdwmgjfz.supabase.co/functions/v1/brand";
function brandIcons(id) { try { localStorage.setItem("fch-scout-club", id); } catch (e) {} const q = "?club=" + id;
  const L = (rel, href) => { let l = document.querySelector('link[rel="' + rel + '"]'); if (!l) { l = document.createElement("link"); l.rel = rel; document.head.appendChild(l); } if (l.getAttribute("href") !== href) l.href = href; };
  L("manifest", BFN + q + "&app=scout"); L("icon", BFN + q + "&icon=1"); L("apple-touch-icon", BFN + q + "&icon=1"); }
(function () { try { const k = new URLSearchParams(location.search).get("k"); if (k) localStorage.setItem("ogv-scoutcode", JSON.stringify(k.trim().toUpperCase())); } catch (e) {} })();
(function () { const p = new URLSearchParams(location.search).get("c"); let id = p; try { id = p || localStorage.getItem("fch-scout-club"); } catch (e) {}
  if (!id || !/^[0-9a-f-]{36}$/i.test(id)) return; brandIcons(id);
  fetch(BFN + "?club=" + id + "&info=1").then(r => r.ok ? r.json() : null).then(c => { if (!c) return; window.LINKC = c; const lg = document.getElementById("hlogo"), R = document.documentElement.style;
    if (lg && c.logo) lg.src = c.logo; document.title = "Scouting · " + (c.short || c.name);
    const hc = document.getElementById("hclub"); if (hc && hc.textContent === "Speler toevoegen") hc.textContent = "Speler toevoegen · " + (c.short || c.name);
    if (c.color && c.id !== "00000000-0000-4000-8000-000000000001") { const h = c.color.replace("#", ""), [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255); R.setProperty("--yellow", c.color); R.setProperty("--onY", .2126 * r + .7152 * g + .0722 * b > .5 ? "#111" : "#fff"); } }).catch(() => {}); })();

const SB_URL = "https://intswyovpwiigdwmgjfz.supabase.co", SB_KEY = "sb_publishable_mGTwxXL1HjKgnJcgSATtxQ_6CvHJ-3W";
/* zelfde aanmelding als de trainersapp (zelfde opslagsleutel): wie daar al aangemeld is, kan hier meteen scouten */
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "implicit", storageKey: "tb_auth", lock: async (_n, _t, fn) => await fn() } });
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)], app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* zelfde posities en plaatsen op het veld als de trainersapp */
const POS = [["DOEL", "Doelman", 50, 90], ["RA", "Rechtsachter", 86, 70], ["LA", "Linksachter", 14, 70], ["CV", "Centrale verdediger", 50, 72], ["VM", "Verdedigende middenvelder", 50, 55], ["CM", "Centrale middenvelder", 50, 42], ["AM", "Aanvallende middenvelder", 50, 29], ["RB", "Rechtsbuiten", 86, 20], ["LB", "Linksbuiten", 14, 20], ["SP", "Spits", 50, 9]];

const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const season = () => { const d = new Date(); const y = d.getMonth() >= 6 ? d.getFullYear() + 1 : d.getFullYear(); return y; };
const catOf = geb => { if (!geb) return ""; const u = season() - +geb.slice(0, 4); return u >= 6 && u <= 21 ? "U" + u : ""; };
let COMP = DEF, CLUBN = "", P, SC;

function blank() { const keep = ls.get("ogv-scout-keep", {}); P = { naam: "", club: "", geb: "", cat: "", voet: "", sterk: "", werk: "", ctx: "", bron: keep.bron || "", dat: keep.dat === today() ? keep.dat : today(), scout: ls.get("ogv-scout-naam", "") || "", pos: [], leer: 0, leerZ: "s" }; SC = {}; }

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return login();
  $("#out").hidden = false;
  let d = (await sb.rpc("club_status")).data || {};
  const pend = ls.get("ogv-scoutcode", ""); if (pend && !(d.member && (d.admin || (d.rechten || []).includes("scouting")))) { const j = await sb.rpc("join_scout", { code: pend }); if (j.data) { ls.set("ogv-scoutcode", ""); d = (await sb.rpc("club_status")).data || {}; } }

    if (lg) lg.src = st.logo && /^(https?:|data:|\.\.\/)/.test(st.logo) ? st.logo : ogv ? "../icons/ogv-192.png" : "../icons/icon-192.png";
    if (st.color && !ogv) { const h = st.color.replace("#", ""), [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255); R.setProperty("--yellow", st.color); R.setProperty("--onY", .2126 * r + .7152 * g + .0722 * b > .5 ? "#111" : "#fff"); }

    if (CLUBN) document.title = "Scouting · " + CLUBN; } $("#hclub").textContent = CLUBN ? "Speler toevoegen · " + CLUBN : "Speler toevoegen";

    $("#jf").onsubmit = async e => { e.preventDefault(); const j = await sb.rpc("join_scout", { code: e.target.code.value.trim() }); if (j.data) start(); else $("#jerr").innerHTML = '<div class="msg">' + (j.error && /andere club/i.test(j.error.message) ? "Dit account hoort al bij een andere club, en een account kan maar bij één club horen. Meld je af en maak een account met een ander e-mailadres om voor deze club te scouten." : "Deze scoutcode klopt niet.") + '</div>'; }; return; }

}

const HERE = location.origin + location.pathname;

  $$("[data-tab]").forEach(b => b.onclick = () => login("", b.dataset.tab));
  const lf = $("#lf"); if (lf) { lf.onsubmit = async e => { e.preventDefault(); e.target.querySelector("button[type=submit]").textContent = "Even geduld…";
      const { error } = await sb.auth.signInWithPassword({ email: e.target.email.value.trim(), password: e.target.pw.value });
      if (error) login(/confirm/i.test(error.message) ? "Bevestig eerst je e-mailadres via de link in de mail die je kreeg." : "Aanmelden lukt niet. Controleer je e-mailadres en wachtwoord."); else start(); };
    $("#forgot").onclick = async e => { e.preventDefault(); const m = lf.email.value.trim(); if (!m) { login("Vul eerst je e-mailadres in."); return; }
      await sb.auth.resetPasswordForEmail(m, { redirectTo: HERE }); login("", "in", "Als dit adres een account heeft, staat er nu een mail met een link om een nieuw wachtwoord te kiezen."); }; }
  const rf = $("#rf"); if (rf) rf.onsubmit = async e => { e.preventDefault(); const f = e.target, code = f.code.value.trim().toUpperCase(); f.querySelector("button[type=submit]").textContent = "Even geduld…";
    ls.set("ogv-scoutcode", code);
    const { data, error } = await sb.auth.signUp({ email: f.email.value.trim(), password: f.pw.value, options: { data: { full_name: f.nm.value.trim(), scoutcode: code }, emailRedirectTo: HERE } });
    if (error) { const ex = /already|exists/i.test(error.message); login(ex ? "Er bestaat al een account met dit e-mailadres. Meld je aan." : /password/i.test(error.message) ? "Kies een sterker wachtwoord (minstens 8 tekens)." : "Account aanmaken lukt niet: " + error.message, ex ? "in" : "nieuw"); return; }
    ls.set("ogv-scout-naam", f.nm.value.trim());
    if (data.session) start(); else login("", "in", "Bijna klaar: klik op de link in de mail die we je stuurden en meld je daarna hier aan."); };
  const pf = $("#pf"); if (pf) pf.onsubmit = async e => { e.preventDefault(); const { error } = await sb.auth.updateUser({ password: e.target.pw.value }); if (error) login("Dat lukte niet: " + error.message, "reset"); else start(); };
}

function keep() { ["naam", "club", "geb", "sterk", "werk", "ctx", "bron", "dat", "scout", "cat"].forEach(k => { const el = $("#" + k); if (el) P[k] = el.value.trim(); }); }

function totHtml() { const xs = COMP.map(c => SC[c.k]).filter(v => v != null); if (!xs.length) return `<div class="tot" id="tot"><span>Het algemeen cijfer verschijnt zodra je een eerste score geeft.</span></div>`;
  const a = xs.reduce((x, y) => x + y, 0) / xs.length; return `<div class="tot" id="tot"><b style="color:${col(a)}">${f1(a)}</b><span>${niv(a)}${xs.length < COMP.length ? ` · ${xs.length} van ${COMP.length} gescoord` : ""}</span></div>`; }

function form(err) {
  const leerApart = !COMP.some(c => c.k === "k4"), auto = catOf(P.geb);
  app.innerHTML = `${err ? `<div class="msg">${esc(err)}</div>` : ""}
  <section class="card"><h2><span class="no">1</span>Speler</h2>
    <label>Naam <span class="req">*</span><input id="naam" value="${esc(P.naam)}" autocomplete="off" placeholder="Voornaam en achternaam"></label>
    <label>Club<input id="club" value="${esc(P.club)}" autocomplete="off"></label>
    <div class="two"><label>Geboortedatum<input id="geb" type="date" value="${esc(P.geb)}"></label>
      <label>Categorie<select id="cat"><option value="">${auto ? "Volgens geboortejaar: " + auto : "Kies de U"}</option>${Array.from({ length: 16 }, (_, i) => "U" + (i + 6)).map(c => `<option${P.cat === c ? " selected" : ""}>${c}</option>`).join("")}</select></label></div>
    <label>Voorkeursvoet</label><div class="seg" role="radiogroup" aria-label="Voorkeursvoet" style="margin:-8px 0 14px">${["Rechts", "Links", "Beide"].map(x => `<button type="button" role="radio" aria-checked="${P.voet === x}" class="${P.voet === x ? "on" : ""}" data-voet="${x}">${x}</button>`).join("")}</div>
  </section>
  <section class="card"><h2><span class="no">2</span><span>Positie <span class="req">*</span></span></h2><div class="pitch">${POS.map(([ab, n, x, y]) => { const i = P.pos.indexOf(n); return `<button type="button" class="${i === 0 ? "h" : i > 0 ? "n" : ""}" style="left:${x}%;top:${y}%" data-pos="${esc(n)}" aria-pressed="${i >= 0}" aria-label="${esc(n)}">${ab}${i >= 0 ? `<i>${i + 1}</i>` : ""}</button>`; }).join("")}</div>
    <p class="hint" style="text-align:center">${P.pos.length ? `<b>Hoofdpositie:</b> ${esc(P.pos[0])}${P.pos.length > 1 ? `<br><b>Kan ook:</b> ${esc(P.pos.slice(1).join(", "))}` : ""}` : "Tik eerst de hoofdpositie, daarna alle andere posities die hij kan spelen."}</p></section>
  <section class="card"><h2><span class="no">3</span>Beoordeling</h2><p class="hint" style="margin:-6px 0 6px">Score van 1 tot 10. Raak een onderdeel enkel aan als je het kon zien.</p>
    ${COMP.map(c => { const v = SC[c.k]; return `<div class="crit${v == null ? " off" : ""}"><div class="t"><span>${esc(c.n)}</span><span class="v" id="v_${c.k}" style="${v != null ? `background:${col(v)};color:#fff` : ""}">${v != null ? f1(v) : "–"}</span></div>
      <input type="range" min="1" max="10" step="0.5" value="${v ?? 5}" style="--p:${(((v ?? 5) - 1) / 9 * 100).toFixed(1)}%;${v != null ? `--f:${col(v)}` : ""}" data-k="${c.k}" aria-label="${esc(c.n)}"><div class="sc"><span>laag</span><span>hoog</span></div>${v != null ? `<button type="button" class="clr" data-clr="${c.k}">Niet gezien</button>` : ""}</div>`; }).join("")}
    ${totHtml()}
    ${leerApart ? `<div class="leer"><b>Leervermogen</b><span class="hint">Apart, telt niet mee in het cijfer. Laat leeg als je het niet kon zien.</span>
      <div class="chips">${[[0, "Niet ingevuld"], ...LV].map(([k, l]) => `<button type="button" class="chip${P.leer === k ? " on" : ""}" data-lv="${k}" aria-pressed="${P.leer === k}">${l}</button>`).join("")}</div>
      ${P.leer ? `<div class="chips"><span class="hint" style="align-self:center;margin:0 4px 0 0">Hoe zeker?</span>${[["s", "Schatting"], ["z", "Goed kunnen beoordelen"]].map(([k, l]) => `<button type="button" class="chip${P.leerZ === k ? " on" : ""}" data-lz="${k}" aria-pressed="${P.leerZ === k}">${l}</button>`).join("")}</div>` : ""}</div>` : ""}
  </section>
  <section class="card"><h2><span class="no">4</span>Notities</h2>
    <label>Sterktes en spelbeschrijving<textarea id="sterk">${esc(P.sterk)}</textarea></label>
    <label>Werkpunten<textarea id="werk">${esc(P.werk)}</textarea></label>
    <label>Situatie en context<textarea id="ctx" placeholder="Rugnummer, matuur, speelminuten…">${esc(P.ctx)}</textarea></label>
  </section>
  <section class="card"><h2><span class="no">5</span>Wedstrijd</h2>
    <label>Wedstrijd of bron<input id="bron" value="${esc(P.bron)}" placeholder="Club A U14 – Club B U14"></label>
    <div class="two"><label>Gescout op<input id="dat" type="date" value="${esc(P.dat)}"></label><label>Scout <span class="req">*</span><input id="scout" value="${esc(P.scout)}" placeholder="Jouw naam"></label></div>
    <p class="hint">Wedstrijd, datum en jouw naam blijven staan voor de volgende speler.</p>
  </section>
  <div class="bar"><button class="btn" type="button" id="save">Speler opslaan</button></div>`;
  $("#geb").onchange = () => { keep(); const y = scrollY; form(); scrollTo(0, y); };
  $$("[data-voet]").forEach(b => b.onclick = () => { keep(); P.voet = P.voet === b.dataset.voet ? "" : b.dataset.voet; const y = scrollY; form(); scrollTo(0, y); });
  $$("[data-pos]").forEach(b => b.onclick = () => { keep(); const n = b.dataset.pos, i = P.pos.indexOf(n); if (i >= 0) P.pos.splice(i, 1); else P.pos.push(n); const y = scrollY; form(); scrollTo(0, y); });
  $$("[data-k]").forEach(r => { r.oninput = () => { const k = r.dataset.k, v = +r.value; SC[k] = v; r.style.setProperty("--p", ((v - 1) / 9 * 100).toFixed(1) + "%"); r.style.setProperty("--f", col(v)); const s = $("#v_" + k); s.textContent = f1(v); s.style.background = col(v); s.style.color = "#fff"; r.parentElement.classList.remove("off"); $("#tot").outerHTML = totHtml(); };
    r.onchange = () => { keep(); const y = scrollY; form(); scrollTo(0, y); }; });
  $$("[data-clr]").forEach(b => b.onclick = () => { keep(); delete SC[b.dataset.clr]; const y = scrollY; form(); scrollTo(0, y); });
  $$("[data-lv]").forEach(b => b.onclick = () => { keep(); P.leer = +b.dataset.lv; const y = scrollY; form(); scrollTo(0, y); });
  $$("[data-lz]").forEach(b => b.onclick = () => { keep(); P.leerZ = b.dataset.lz; const y = scrollY; form(); scrollTo(0, y); });
  $("#save").onclick = save;
}

async function save() {
  keep();
  if (!P.naam || !P.pos[0] || !P.scout) { form("Vul minstens de naam, de hoofdpositie en jouw naam als scout in."); scrollTo(0, 0); return; }
  const b = $("#save"); b.textContent = "Opslaan…"; b.style.pointerEvents = "none";
  const data = { naam: P.naam, club: P.club, geb: P.geb, cat: P.cat, voet: P.voet, sterk: P.sterk, werk: P.werk, ctx: P.ctx, bron: P.bron, dat: P.dat, scout: P.scout, stat: "Nieuw", p1: P.pos[0] || "", p2: P.pos[1] || "", p3: P.pos[2] || "", ts: Date.now() }; if (P.pos.length > 3) data.pn = P.pos.slice(3);
  for (const c of COMP) if (SC[c.k] != null) data[c.k] = SC[c.k];
  if (!COMP.some(c => c.k === "k4") && P.leer) { data.k4 = P.leer; if (P.leerZ === "z") data.k4z = true; }
  Object.keys(data).forEach(k => { if (data[k] === "") delete data[k]; });
  const { error } = await sb.from("scouting").insert({ id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), data, updated_at: new Date().toISOString() });
  if (error) { form("Opslaan lukte niet. Controleer je internetverbinding en probeer opnieuw."); return; }
  ls.set("ogv-scout-naam", P.scout); ls.set("ogv-scout-keep", { bron: P.bron, dat: P.dat });
  const done = ls.get("ogv-scout-done", []).filter(x => x.d === today()); done.unshift({ n: P.naam, c: P.club, d: today() }); ls.set("ogv-scout-done", done.slice(0, 30));
  app.innerHTML = `<div class="card done"><div class="ok">✓</div><h2>${esc(P.naam)} is opgeslagen</h2><p class="hint">De speler staat nu in de externe scouting van de club.</p></div>
    <div class="card"><h2>Vandaag toegevoegd</h2><ul class="list">${done.map(x => `<li><b>${esc(x.n)}</b><small>${esc(x.c || "")}</small></li>`).join("")}</ul></div>
    <div class="bar"><button class="btn" type="button" id="next">Nog een speler toevoegen</button></div>`;
  scrollTo(0, 0); $("#next").onclick = () => { blank(); form(); scrollTo(0, 0); };
}

$("#out").onclick = async () => { await sb.auth.signOut(); login(); };
let RECOVERY = /type=recovery/.test(location.hash);
sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") { RECOVERY = true; setTimeout(() => login("", "reset"), 0); } });
(RECOVERY ? Promise.resolve(setTimeout(() => login("", "reset"), 300)) : start()).catch(() => login("Er ging iets mis bij het laden. Probeer opnieuw."));
</script>
</body>
</html>
