# Houdt het gratis Supabase-project van OGV Trainers wakker.
# Supabase pauzeert een gratis project na 7 dagen zonder gebruik (bv. in de zomer of de kerstvakantie).
# Deze taak roept elke dag een kleine, openbare functie op (ping) die geen gegevens teruggeeft.
# De sleutel hieronder is dezelfde publieke sleutel die ook in de app staat; ze geeft geen toegang tot gegevens.
name: Supabase wakker houden
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://intswyovpwiigdwmgjfz.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_mGTwxXL1HjKgnJcgSATtxQ_6CvHJ-3W" \
            -H "Content-Type: application/json" -d '{}')
          echo "Antwoord van Supabase: $code"
          test "$code" = "200"
