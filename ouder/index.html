<!doctype html>
<html lang="nl">
<head>

<title>OGV Ouders</title>
<link rel="manifest" href="manifest.webmanifest">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght,wdth@400..900,100..125&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F3EE;--card:#fff;--card2:#F7F7F2;--ink:#121311;--muted:#5D5F56;--line:#E2E2DA;--yellow:#FFD100;--ok:#15803D;--okbg:#DCF5E3;--bad:#C2261D;--badbg:#FDE2E0;--chip:#F1F1EA;--blue:#1D5FD1;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111111;--card:#191A17;--card2:#20211D;--ink:#F2F2EE;--muted:#9EA098;--line:#2A2C26;--ok:#4ADE80;--okbg:#132619;--bad:#F87171;--badbg:#2E1414;--chip:#252621;--blue:#60A5FA;color-scheme:dark}
  .act button[aria-pressed="true"].ja,.act button[aria-pressed="true"].nee{color:#111}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Archivo",system-ui,-apple-system,sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
a{color:inherit}
/* kop */
.top{background:#111111;color:#F2F2EE;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 18px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,209,0,.12);pointer-events:none}
.top .in,.wrap{max-width:560px;margin:0 auto}
.top .in{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;color:#B8BAB2}
.brand img{height:40px;width:auto}
.brand .rf{margin-left:auto;border:1px solid #3A3C35;background:transparent;color:#F2F2EE;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.brand .rf svg{width:17px;height:17px}.brand .rf.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
h1{margin:12px 0 2px;font-weight:900;font-stretch:118%;font-size:clamp(28px,8vw,38px);line-height:1;letter-spacing:-.01em}
h1 span{color:var(--yellow)}
.top p{margin:0;color:#B8BAB2;font-size:15px}
.kids{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.kids button{border:1px solid #3A3C35;background:transparent;color:#F2F2EE;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.kids button[aria-pressed="true"]{background:var(--yellow);color:#111;border-color:var(--yellow)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--c,#999);flex:none}
.wrap{padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}
h2{font-size:19px;margin:10px 0 0;font-weight:900;font-stretch:110%;display:flex;align-items:center;gap:8px}
h2 small{font-weight:600;font-size:13px;color:var(--muted);font-stretch:100%}
/* volgende activiteit */
.hero{background:#111111;color:#F2F2EE;border-radius:22px;padding:18px;border:1px solid #2A2C26;display:flex;flex-direction:column;gap:8px}
@media (prefers-color-scheme:light){.hero{box-shadow:0 10px 30px rgba(0,0,0,.18)}}
.hero .when{font-size:13px;font-weight:800;color:var(--yellow);text-transform:uppercase;letter-spacing:.06em}
.hero .what{font-size:24px;font-weight:900;font-stretch:112%;line-height:1.1}
.hero .meta{color:#C8CAC0;font-size:15px;display:flex;flex-direction:column;gap:2px}
.hero .meta b{color:#fff}
.hero .act{margin-top:6px}.hero .act button{border-color:#3A3C35;color:#F2F2EE}
.hero .convo{background:#123A20;color:#DCF5E3}.hero .convo.off{background:#1C1E19;color:#B8BAB2}
.hero .state{color:#B8BAB2}
.meta-f{font-size:14px;color:#C8CAC0}.meta-f i{font-style:normal;font-weight:800;color:#111;background:var(--yellow);border-radius:6px;padding:1px 7px;margin-right:4px}.meta-f a{color:#fff}
.todo{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:14px;padding:12px 14px}
.todo span{flex:1;font-size:15px}.todo b{font-weight:800}
/* activiteiten */
.wk{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:8px 2px -4px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:54px 1fr;gap:4px 12px}
.ev.cancel{opacity:.65}
.date{grid-row:span 2;width:54px;height:58px;border-radius:12px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.date b{font-size:22px;font-weight:800}.date small{font-size:12px;color:var(--muted);text-transform:capitalize}
.ev.match .date{background:var(--yellow);color:#111}.ev.match .date small{color:#3d3a1f}
.ev .t{font-weight:800;font-size:17px;line-height:1.2}
.ev .m{font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);margin-right:4px;vertical-align:1px}
.tag.kid{background:transparent;border:1px solid var(--line);color:var(--ink)}
.tag.off{background:var(--badbg);color:var(--bad)}
.fld{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fld i{font-style:normal;font-weight:800;color:var(--ink);background:var(--chip);border-radius:6px;padding:1px 7px}
.act{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.act button{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:transparent;font-weight:700;font-size:16px;cursor:pointer}
.act button[aria-pressed="true"].ja{background:var(--ok);border-color:var(--ok);color:#fff}
.act button[aria-pressed="true"].nee{background:var(--bad);border-color:var(--bad);color:#fff}
.why{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.why button{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.why button[aria-pressed="true"]{border-color:var(--bad);color:var(--bad)}
.why input{flex:1;min-width:160px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;color:var(--ink)}
.foot2{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:4px}
.state{font-size:13px;color:var(--muted);min-height:1em;flex:1}
.ics{border:0;background:none;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;padding:4px 0;text-decoration:underline}
.convo{grid-column:1/-1;display:flex;flex-direction:column;gap:2px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--okbg);font-size:14.5px}
.convo.off{background:var(--chip);color:var(--muted)}
/* kaarten */
.note{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--yellow);border-radius:14px;padding:12px 14px}
.note.tr{border-left-color:var(--blue)}
.note[data-go]{cursor:pointer}
.note small{display:block;color:var(--muted);font-size:12.5px}.note b{display:block;font-size:17px;margin-top:2px}.note p{margin:6px 0 0;white-space:pre-wrap}
.msg{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}
.msg b{display:block;font-size:19px;margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{margin:0 0 4px;font-size:18px}
.card p.h{margin:0 0 12px;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat small{display:block;font-size:12.5px;color:var(--muted);font-weight:700}.stat b{font-size:28px;font-weight:900;font-stretch:112%;line-height:1.1}.stat span{display:block;font-size:12.5px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.res{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.evc{margin-top:10px}.evg{font-weight:800;font-size:13.5px;color:var(--muted);margin:12px 0 2px}
.evr{display:grid;grid-template-columns:minmax(0,1fr) 72px 44px;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.evn{min-width:0;font-weight:700;font-size:15px}.evn small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.evb{height:8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);overflow:hidden}.evb i{display:block;height:100%;border-radius:99px}
.evr b{text-align:right;font-size:17px}.evr b span{font-size:12px;color:var(--muted);font-weight:600}
.evtx{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.evtx small{display:block;font-weight:800;font-size:13px;color:var(--muted)}.evtx p{margin:4px 0 0}
.res:first-child{border-top:0}
.res .rp{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
.rp.w{background:var(--okbg);color:var(--ok)}.rp.l{background:var(--badbg);color:var(--bad)}.rp.d{background:var(--chip);color:var(--muted)}
.res .rm{flex:1;min-width:0}.res .rm b{display:block;font-size:15px}.res .rm small{color:var(--muted);font-size:13px}.res .sc{font-weight:900;font-size:18px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;font-weight:400;color:var(--ink);width:100%;min-width:0}
.f textarea{min-height:80px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ct{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.ct>b{display:block;font-size:14px;margin-bottom:6px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--yellow);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:0;background:var(--yellow);color:#111;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{min-height:38px;font-size:14px;padding:0 14px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.ok{color:var(--ok);font-size:14px;font-weight:700}
.install{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.install img{width:44px;height:44px;border-radius:12px;flex:none}
.install>div>b{display:block}.install p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.install .x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 4px}
.foot{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.sent{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.sent div{background:var(--card2);border-radius:12px;padding:10px 12px;font-size:14.5px}.sent small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sk{height:120px;border-radius:18px;background:var(--card);border:1px solid var(--line);animation:p 1.2s ease-in-out infinite alternate}
@keyframes p{to{opacity:.5}}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs .in{display:flex;max-width:560px;width:100%}
.tabs button{flex:1;border:0;background:none;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;position:relative}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{background:var(--yellow);color:#111;border-radius:999px;padding:2px 12px;width:48px;box-sizing:border-box}
.tabs .bd{position:absolute;top:6px;left:calc(50% + 10px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14.5px;font-weight:700;z-index:9;max-width:90vw;text-align:center}
.off-line{background:#7c5b00;color:#fff;text-align:center;font-size:13px;padding:6px}
@media (prefers-reduced-motion:reduce){.sk,.brand .rf.spin svg{animation:none}}
</style>
</head>
<body>
<div class="off-line" id="offl" hidden>Geen internet. Je ziet de laatst bekende gegevens.</div>
<header class="top"><div class="in"><div class="brand"><img src="../icons/logo-dark.png" alt="OG Vorselaar"><span>OG Vorselaar · voor ouders</span>
  <button class="rf" type="button" id="rf" aria-label="Vernieuwen" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button></div>

  <button type="button" data-v="seizoen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>Seizoen</button>

  <button type="button" data-v="gegevens"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Gegevens</button>
</div></nav>
<script src="../tactiekbord/vendor/supabase-2.118.0.js"></script>
<script>
"use strict";
/* OGV Ouders — de app voor ouders van OG Vorselaar. Geen account nodig: elke speler heeft een persoonlijke link van de trainer.
   Open je de link van een tweede kind, dan komt dat kind erbij. Wat je ziet, blijft op dit toestel bewaard (ook zonder internet). */
const SB_URL = "https://intswyovpwiigdwmgjfz.supabase.co", SB_KEY = "sb_publishable_mGTwxXL1HjKgnJcgSATtxQ_6CvHJ-3W";
const demo = /[?&]demo\b/.test(location.search), KK = demo ? "ogv-ouders-kids-demo" : "ogv-ouders-kids", CK = KK + "-cache", SEEN = KK + "-seen";
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const WHY = ["Ziek", "Geblesseerd", "Andere activiteit", "Op reis"], COL = ["#FFD100", "#38BDF8", "#F472B6", "#4ADE80", "#A78BFA"];
const CLUB = "OG Vorselaar, Riemenstraat 89, 2290 Vorselaar";
const FLD = { A: ["Terrein A", "A1–A3 (bij de kantine)"], B: ["Terrein B", "B1–B4"], C: ["Terrein C", "B1–B4"], D: ["Kunstgrasveld (KGV)", "B1–B4"], E: ["Terrein E", "E4–E8"], "1": ["Terrein 1", "B1–B4"], "2": ["Terrein 2", "B1–B4"] };
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let sb = null, kids = store.get(KK, []), data = {}, view = "agenda", only = null, busy = false;
const toast = t => { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); };
function fieldOf(loc) { const s = String(loc || "").toLowerCase(); if (!s) return null; if (/\bkgv\b|kunstgras/.test(s)) return "D";
  const m = s.match(/(?:terrein|veld|plein)\s*([a-e]|[12])\b/) || s.match(/(?:^|\s)([a-e]|[12])[\s-]*(?:plein|veld|terrein)\b/); return m ? m[1].toUpperCase() : null; }

/* ---------- gegevens (demo leest de demo van het trainersplatform in deze browser) ---------- */
const DK = "ogv-platform-demo-v2", dget = () => store.get(DK, null), dput = d => store.set(DK, d);
function demoKid(tok) {
  const d = dget(), p = d?.players?.find(x => x.parent_token === tok || x.player_token === tok); if (!p) return null; const kid = p.player_token === tok;
  const today = new Date().toISOString().slice(0, 10), lim = new Date(Date.now() + 42 * 864e5).toISOString().slice(0, 10), from = new Date(Date.now() - 35 * 864e5).toISOString().slice(0, 10);
  const att = (d.attendance || []).filter(a => a.player_id === p.id), tev = d.events.filter(e => e.team_id === p.team_id);
  const trs = tev.filter(e => e.type === "training" && !e.cancelled && e.date <= today && (d.attendance || []).some(a => a.event_id === e.id));
  return { v: 18, role: kid ? "speler" : "ouder", player: p.first_name, number: p.number, team: d.teams.find(t => t.id === p.team_id)?.name, trainers: ["Demo Trainer"], contacts: kid ? [] : p.contacts || [], medical: kid ? null : p.medical || null, consent: kid ? null : p.consent || null, updated: kid ? null : p.parent_updated || null,
    events: tev.filter(e => e.date >= today && e.date <= lim).sort((a, b) => (a.date + (a.start_time || "")).localeCompare(b.date + (b.start_time || ""))).map(e => { const r = (d.rsvp || []).find(x => x.event_id === e.id && x.player_id === p.id);
      return { id: e.id, type: e.type, date: e.date, start: (e.start_time || "").slice(0, 5), end: (e.end_time || "").slice(0, 5), location: e.location, part: e.field_part || null, kk: e.kk_home || null, opponent: e.opponent, home: e.home, state: e.cancelled ? "afgelast" : e.rbfa_state,
        convo: e.convo && e.convo.sent ? { selected: (e.convo.players || []).includes(p.id), meet: e.convo.meet, place: e.convo.place, bring: e.convo.bring, note: e.convo.note } : null, rsvp: r?.status || null, note: r?.note || null }; }),
    results: tev.filter(e => e.type === "wedstrijd" && e.date < today && e.date >= from && e.score_for != null).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6).map(e => { const a = att.find(x => x.event_id === e.id);

const EVM = { 1: "Start seizoen", 2: "Herfst", 3: "Winterstop", 4: "Maart", 5: "Einde seizoen" };

    if (!g) { g = { name: "", items: [] }; out.push(g); }
    const name = l.split(/\s+\|\s+/)[0].trim(); seen.add(name); if (scores[name] != null && scores[name] !== "") g.items.push([name, +scores[name]]); }
  const rest = Object.keys(scores).filter(k => !seen.has(k) && scores[k] != null && scores[k] !== ""); if (rest.length) out.push({ name: out.length ? "Andere" : "", items: rest.map(k => [k, +scores[k]]) });

const evCol = n => n >= 4 ? "var(--ok)" : n >= 3 ? "var(--yellow)" : n >= 2 ? "#E8890C" : "var(--bad)";

    const me = isKid(k.tok), cheer = !me ? "" : pct >= 90 ? "🔥 Topper: je bent bijna altijd op training!" : s.goals >= 5 ? "⚽ Doelpuntenmachine!" : s.matches >= 5 ? "💪 Al " + s.matches + " wedstrijden gespeeld dit seizoen!" : "Elke training telt. Komaan OG!";
    return `<h2><span class="dot" style="--c:${kidCol(k.tok)}"></span>${me ? "Jouw seizoen" : esc(k.name)} <small>${esc(x.team || "")}</small></h2>${cheer ? `<div class="note"><b style="margin:0">${cheer}</b></div>` : ""}
      <div class="stats"><div class="stat"><small>Op training</small><b>${pct == null ? "–" : pct + "%"}</b><span>${s.present} van ${s.trainings} trainingen</span>${pct == null ? "" : `<div class="bar"><i style="width:${pct}%"></i></div>`}</div>
        <div class="stat"><small>Wedstrijden</small><b>${s.matches}</b><span>meegespeeld dit seizoen</span></div>
        <div class="stat"><small>Doelpunten</small><b>${s.goals}</b><span>dit seizoen</span></div><div class="stat"><small>Assists</small><b>${s.assists}</b><span>dit seizoen</span></div></div>
      <div class="card"><h3>Laatste uitslagen</h3>${rs.length ? rs.map(r => { const res = r.for > r.against ? "w" : r.for < r.against ? "l" : "d", us = x.team || "OGV";
        return `<div class="res"><span class="rp ${res}">${{ w: "W", l: "V", d: "G" }[res]}</span><span class="rm"><b>${r.home === false ? esc(r.opponent || "") + " – " + esc(us) : esc(us) + " – " + esc(r.opponent || "")}</b><small>${dayFmt(r.date).toLocaleDateString("nl-BE", { weekday: "short", day: "numeric", month: "short" })} · ${r.played ? (me ? "je speelde mee" : esc(k.name) + " speelde mee") + (r.goals ? ` · ⚽ ${r.goals}` : "") + (r.assists ? ` · ${r.assists} assist` : "") : (me ? "je speelde niet mee" : "niet meegespeeld")}</small></span><span class="sc">${r.home === false ? r.against + " – " + r.for : r.for + " – " + r.against}</span></div>`; }).join("")
        : `<p class="h" style="margin:0">Nog geen uitslagen de laatste weken.</p>`}</div>${evalHtml(x.ev, me)}`; }).join("") || `<div class="msg"><b>Nog niets</b></div>`;
}

/* ---------- berichten ---------- */
function drawMessages() {
  const ms = msgsAll().filter(m => !only || !m.kid || m.kid.tok === only), ks = sel().filter(k => !isKid(k.tok)), can = ks.some(k => (data[k.tok]?.v || 0) >= 17);
  $("#list").innerHTML = (!ks.length ? "" : `<div class="card"><h3>Bericht aan de trainer</h3><p class="h">Bv. "Lio komt pas om 18u15" of een vraag. De trainer ziet je bericht in zijn app.</p>
      ${can ? `<form id="askf">${ks.length > 1 ? `<label class="f">Over<select name="kid">${ks.map(k => `<option value="${k.tok}">${esc(k.name)} (${esc(k.team || "")})</option>`).join("")}</select></label>` : ""}
        <label class="f" style="margin-top:8px">Je bericht<textarea name="body" maxlength="1000" required placeholder="Typ hier je bericht"></textarea></label>
        <label class="f" style="margin-top:8px">Je naam<input name="who" value="${esc(store.get("ogv-ouders-name", ""))}" placeholder="bv. Sofie (mama van Lio)"></label>
        <div class="row"><button class="btn" type="submit">Versturen</button><span class="ok" id="asko"></span></div></form>
        ${ks.map(k => (data[k.tok]?.asked || []).map(q => ({ ...q, k }))).flat().length ? `<div class="sent">${ks.map(k => (data[k.tok]?.asked || []).map(q => `<div>${esc(q.body)}<small>${new Date(q.date).toLocaleString("nl-BE", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}${ks.length > 1 ? " · " + esc(k.name) : ""} · ${q.read ? "gelezen door de trainer ✓" : "nog niet gelezen"}</small></div>`).join("")).join("")}</div>` : ""}`
      : `<p class="h" style="margin:0">Berichten sturen kan binnenkort. Tot dan kan je de trainer gewoon aanspreken of bellen.</p>`}</div>`) + `
    <h2>Nieuws</h2>` + (ms.length ? ms.map(m => `<div class="note${m.club ? "" : " tr"}"><small>${m.club ? "Van de club" : "Van de trainer van " + esc(m.kid?.name || "")}${m.author ? " · " + esc(m.author) : ""} · ${dayFmt(m.date).toLocaleDateString("nl-BE", { day: "numeric", month: "short" })}</small><b>${esc(m.title)}</b>${m.body ? `<p>${esc(m.body)}</p>` : ""}</div>`).join("")
    : `<div class="msg"><b>Geen nieuws</b>Berichten van de club en de trainer verschijnen hier.</div>`);
  store.set(SEEN, [...new Set([...store.get(SEEN, []), ...ms.map(m => m.key)])].slice(-200));
  const f = $("#askf"); if (f) f.onsubmit = async ev => { ev.preventDefault(); const tok = f.kid ? f.kid.value : ks[0].tok, body = f.body.value.trim(), who = f.who.value.trim(); if (!body) return;
    store.set("ogv-ouders-name", who); const o = $("#asko"), b = f.querySelector("button"); b.disabled = true; o.textContent = "Versturen…";
    try { if (!await ask(tok, body, who)) throw new Error("limiet"); (data[tok].asked = data[tok].asked || []).unshift({ body, date: new Date().toISOString(), read: false }); saveCache(); toast("Verstuurd naar de trainer."); drawMessages(); }
    catch (x) { b.disabled = false; o.textContent = x.message === "limiet" ? "Je stuurde vandaag al veel berichten. Probeer morgen opnieuw." : errMsg(x, "Berichten sturen"); } };
}

/* ---------- gegevens ---------- */
function drawProfile() {
  const list = sel().filter(k => !isKid(k.tok));
  $("#list").innerHTML = `<h2>Gegevens</h2><p style="margin:0;color:var(--muted);font-size:14.5px">Zo kan de trainer je bereiken, bv. bij een blessure. Alleen de trainers van de ploeg zien dit.</p>` + list.map(k => { const x = data[k.tok], cs = (x.contacts || []).slice(0, 2); while (cs.length < 2) cs.push({}); const c = x.consent || {};
    return `<form class="card" data-pf="${k.tok}"><h3>${esc(k.name)} <span style="color:var(--muted);font-weight:500;font-size:15px">· ${esc(x.team || "")}</span></h3>
      ${cs.map((ct, i) => `<div class="ct"><b>${i ? "Tweede contactpersoon" : "Contactpersoon"}</b><div class="grid"><label class="f">Naam<input name="n${i}" value="${esc(ct.name || "")}" autocomplete="name"></label>
        <label class="f">Relatie<select name="r${i}">${["", "Mama", "Papa", "Voogd", "Grootouder", "Andere"].map(r => `<option${r === (ct.rel || "") ? " selected" : ""}>${r}</option>`).join("")}</select></label>
        <label class="f">Gsm<input name="p${i}" type="tel" inputmode="tel" value="${esc(ct.phone || "")}" autocomplete="tel"></label><label class="f">E-mail<input name="e${i}" type="email" value="${esc(ct.email || "")}" autocomplete="email"></label></div></div>`).join("")}
      <div class="ct"><label class="f">Medische aandachtspunten (allergie, medicatie, astma…)<textarea name="med" placeholder="Leeg laten als er niets is">${esc(x.medical || "")}</textarea></label></div>
      <div class="ct"><b>Foto's en video's</b>
        <label class="chk"><input type="checkbox" name="ca"${c.analysis ? " checked" : ""}><span>De trainer mag beelden van ${esc(k.name)} maken om met de ploeg te analyseren. Ze blijven in de app van de club.</span></label>
        <label class="chk"><input type="checkbox" name="cp"${c.public ? " checked" : ""}><span>De club mag foto's waarop ${esc(k.name)} herkenbaar is gebruiken op de website en sociale media.</span></label>
        <label class="f" style="margin-top:10px">Naam van de ouder die dit invult<input name="cn" value="${esc(c.name || store.get("ogv-ouders-name", ""))}"></label></div>
      <div class="row"><button class="btn" type="submit">Bewaren</button><span class="ok" data-ok>${x.updated ? "Laatst bijgewerkt " + new Date(x.updated).toLocaleDateString("nl-BE", { day: "numeric", month: "short" }) : ""}</span></div>
      <p style="margin:14px 0 0;font-size:13px;color:var(--muted)">Je kan dit altijd aanpassen of laten wissen. Meer uitleg in de privacyverklaring van de club.</p></form>`; }).join("") +
    `<div class="card"><h3>Nog een kind bij OG Vorselaar?</h3><p class="h" style="margin:0">Open de persoonlijke link die je van de trainer van dat kind kreeg. Het komt er dan vanzelf bij in deze app.</p>
      <div class="row">${kids.map(k => `<button class="btn ghost sm" type="button" data-rm="${k.tok}">${esc(k.name || "Kind")} van dit toestel halen</button>`).join("")}</div></div>`;
  $$("[data-pf]").forEach(f => f.onsubmit = async ev => { ev.preventDefault(); const tok = f.dataset.pf, F = f.elements, ok = f.querySelector("[data-ok]");
    const c = [0, 1].map(i => ({ name: F["n" + i].value.trim(), rel: F["r" + i].value, phone: F["p" + i].value.trim(), email: F["e" + i].value.trim() })).filter(x => x.name || x.phone || x.email);
    const cons = { analysis: F.ca.checked, public: F.cp.checked, name: F.cn.value.trim() };
    ok.textContent = "Bewaren…";
    try { if (!await saveProfile(tok, c, F.med.value.trim(), cons)) throw new Error(); Object.assign(data[tok], { contacts: c, medical: F.med.value.trim() || null, consent: cons, updated: new Date().toISOString() }); saveCache(); ok.textContent = "Bewaard. Bedankt!"; toast("Gegevens bewaard."); }
    catch (x) { ok.textContent = errMsg(x, "Gegevens invullen"); } });
  $$("[data-rm]").forEach(b => b.onclick = () => { if (!confirm("Dit kind van dit toestel halen? Met de link van de trainer kan je het later opnieuw toevoegen.")) return;
    kids = kids.filter(k => k.tok !== b.dataset.rm); store.set(KK, kids); const c = store.get(CK, {}); delete c[b.dataset.rm]; store.set(CK, c); only = null; start(); });
}
function draw() { header(); ({ agenda: drawAgenda, seizoen: drawSeason, berichten: drawMessages, gegevens: drawProfile }[view])(); header(); }

/* ---------- in de agenda van je gsm ---------- */
function icsDownload(rows, name) {
  const t = s => (s || "").replace(":", "") + "00", ev = rows.map(({ e, k }) => { const d = e.date.replace(/-/g, ""), end = e.end || (e.start ? String(Math.min(23, +e.start.slice(0, 2) + (e.type === "wedstrijd" ? 2 : 1))).padStart(2, "0") + e.start.slice(2) : "");
    const title = (e.type === "wedstrijd" ? (e.home === false ? "Uit bij " : "Thuis tegen ") + (e.opponent || "") : "Training") + " – " + k.name, f = fieldOf(e.location);
    const desc = [e.convo && e.convo.selected && e.convo.meet ? "Verzamelen om " + e.convo.meet + (e.convo.place ? " – " + e.convo.place : "") : "", f ? FLD[f][0] + " · kleedkamers " + FLD[f][1] : ""].filter(Boolean).join(" · ");
    const loc = e.home === false && e.location ? e.location.split(" · ").pop() : CLUB;
    return ["BEGIN:VEVENT", "UID:" + e.id + "-" + k.tok.slice(0, 8) + "@ogv", "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z",
      e.start ? "DTSTART:" + d + "T" + t(e.start) : "DTSTART;VALUE=DATE:" + d, e.start ? "DTEND:" + d + "T" + t(end) : "", "SUMMARY:" + title.replace(/[,;]/g, " "), "LOCATION:" + loc.replace(/[,;]/g, " "), desc ? "DESCRIPTION:" + desc.replace(/[,;]/g, " ") : "", "END:VEVENT"].filter(Boolean).join("\r\n"); });
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//OG Vorselaar//OGV Ouders//NL", ...ev, "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([L], { type: "text/calendar" })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* ---------- installeren ---------- */
let deferred = null;
addEventListener("beforeinstallprompt", ev => { ev.preventDefault(); deferred = ev; if (view === "agenda" && $("#inst")) draw(); });
function bindInstall() { const x = $("#instx"); if (x) x.onclick = () => { store.set("ogv-ouders-noinstall", true); $("#inst").remove(); };
  const b = $("#instb"); if (b) b.onclick = async () => { deferred.prompt(); await deferred.userChoice; deferred = null; $("#inst")?.remove(); }; }

/* ---------- opstarten ---------- */
function fail(title, text) { $("#h").innerHTML = `OGV <span>Ouders</span>`; $("#sub").textContent = "De app voor ouders van OG Vorselaar"; $("#tabs").hidden = true; $("#list").innerHTML = `<div class="msg"><b>${title}</b>${text}</div>`; }
async function start() {
  if (!kids.length) { fail("Open de link van de trainer", "Je kreeg van de trainer een persoonlijke link voor je kind. Open die link één keer: daarna vind je hier de trainingen, wedstrijden, convocaties en berichten terug."); return; }
  await load();
  if (kids.some(k => data[k.tok] === null)) { kids = kids.filter(k => data[k.tok] !== null); store.set(KK, kids); }
  if (!kids.length) { fail("Deze link werkt niet meer", "De trainer heeft misschien een nieuwe link gemaakt. Vraag hem om de juiste link."); return; }
  $("#tabs").hidden = false; draw();
}
async function refresh() { if (busy) return; busy = true; $("#rf").classList.add("spin"); await load(); $("#rf").classList.remove("spin"); busy = false; draw(); }
$$("[data-v]").forEach(b => b.onclick = () => { view = b.dataset.v; draw(); scrollTo(0, 0); });
$("#rf").onclick = refresh;
(async () => {
  const tok = decodeURIComponent(location.hash.slice(1)).trim();
  if (tok) { if (!/^[0-9a-f-]{36}$/i.test(tok)) { fail("Deze link is niet volledig", "Open de link precies zoals de trainer hem stuurde, of vraag de trainer om een nieuwe."); return; }
    if (!kids.some(k => k.tok === tok)) kids.push({ tok, name: "", team: "" }); store.set(KK, kids); only = null;
    history.replaceState(null, "", location.pathname + location.search); } /* de code niet in de adresbalk laten staan */
  if (!demo) { if (!window.supabase) { const c = store.get(CK, {}); kids.forEach(k => data[k.tok] = c[k.tok]); if (kids.some(k => data[k.tok])) { $("#offl").hidden = false; $("#tabs").hidden = false; draw(); } else fail("Geen verbinding", "Controleer je internetverbinding en probeer opnieuw."); return; }
    sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: "ogv_ouder" } }); }
  /* meteen de laatst bekende gegevens tonen, daarna verversen */
  const c = store.get(CK, {}); if (kids.length && kids.every(k => c[k.tok])) { kids.forEach(k => data[k.tok] = c[k.tok]); $("#tabs").hidden = false; draw(); }
  await start();
  if ("serviceWorker" in navigator && !demo) navigator.serviceWorker.register("sw.js").catch(() => {});
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && kids.length) refresh(); });
})();
</script>
</body>
