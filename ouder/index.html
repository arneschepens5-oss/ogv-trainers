<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OGV Ouders">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>OGV Ouders</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/favicon.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght,wdth@400..900,100..125&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F3EE;--card:#fff;--ink:#121311;--muted:#585A52;--line:#E0E0D8;--yellow:#FFD500;--ok:#15803D;--okbg:#DCF5E3;--bad:#C2261D;--badbg:#FDE2E0;--chip:#F1F1EA;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#0D0E0C;--ink:#F2F2EE;--muted:#9EA098;--line:#24261F;--ok:#4ADE80;--okbg:#132619;--bad:#F87171;--badbg:#2E1414;--chip:#1C1E19;color-scheme:dark}
  .act button[aria-pressed="true"].ja,.act button[aria-pressed="true"].nee{color:#000}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Archivo",system-ui,-apple-system,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.top{background:#000;color:#F2F2EE;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 18px}
.top .in,.wrap{max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;color:#B8BAB2}
.brand img{width:30px;height:30px;border-radius:50%;background:#fff;padding:2px}
h1{margin:12px 0 4px;font-weight:900;font-stretch:118%;font-size:clamp(28px,8vw,38px);line-height:1;letter-spacing:-.01em}
h1 span{color:var(--yellow)}
.top p{margin:0;color:#B8BAB2;font-size:15px}
.kids{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.kids button{border:1px solid #3A3C35;background:transparent;color:#F2F2EE;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.kids button[aria-pressed="true"]{background:var(--yellow);color:#000;border-color:var(--yellow)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--c,#999)}
.wrap{padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}
h2{font-size:19px;margin:8px 0 0;font-weight:900;font-stretch:110%}
.ev{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:54px 1fr;gap:4px 12px}
.ev.cancel{opacity:.6}
.date{grid-row:span 2;width:54px;height:58px;border-radius:12px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.date b{font-size:22px;font-weight:800}.date small{font-size:12px;color:var(--muted);text-transform:capitalize}
.ev .t{font-weight:800;font-size:17px;line-height:1.2}
.ev .m{font-size:14px;color:var(--muted)}
.ev .m a{color:inherit}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);margin-right:4px;vertical-align:1px}
.tag.match{background:var(--yellow);color:#000}
.tag.kid{background:transparent;border:1px solid var(--line);color:var(--ink)}
.act{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.act button{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:transparent;font-weight:700;font-size:16px;cursor:pointer}
.act button[aria-pressed="true"].ja{background:var(--ok);border-color:var(--ok);color:#fff}
.act button[aria-pressed="true"].nee{background:var(--bad);border-color:var(--bad);color:#fff}
.why{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.why button{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.why button[aria-pressed="true"]{border-color:var(--bad);color:var(--bad)}
.why input{flex:1;min-width:160px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px}
.foot2{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:4px}
.state{font-size:13px;color:var(--muted);min-height:1em;flex:1}
.ics{border:0;background:none;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;padding:4px 0;text-decoration:underline}
.convo{grid-column:1/-1;display:flex;flex-direction:column;gap:2px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--okbg);font-size:14.5px}
.convo.off{background:var(--chip);color:var(--muted)}
.note{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--yellow);border-radius:14px;padding:12px 14px}
.note[data-go]{cursor:pointer}
.note small{display:block;color:var(--muted);font-size:12.5px}.note b{display:block;font-size:17px;margin-top:2px}.note p{margin:6px 0 0}
.msg{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}
.msg b{display:block;font-size:19px;margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{margin:0 0 4px;font-size:18px}
.card p.h{margin:0 0 12px;color:var(--muted);font-size:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;font-weight:400;color:var(--ink);width:100%;min-width:0}
.f textarea{min-height:76px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ct{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.ct>b{display:block;font-size:14px;margin-bottom:6px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--yellow);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:0;background:var(--yellow);color:#000;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.ok{color:var(--ok);font-size:14px;font-weight:700}
.install{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.install img{width:44px;height:44px;border-radius:12px;flex:none}
.install>div>b{display:block}.install p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.install .x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 4px}
.foot{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.sk{height:120px;border-radius:18px;background:var(--card);border:1px solid var(--line);animation:p 1.2s ease-in-out infinite alternate}
@keyframes p{to{opacity:.5}}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs .in{display:flex;max-width:560px;width:100%}
.tabs button{flex:1;border:0;background:none;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;position:relative}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{background:var(--yellow);color:#000;border-radius:999px;padding:2px 12px;width:48px;box-sizing:border-box}
.tabs .bd{position:absolute;top:6px;left:calc(50% + 10px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.off-line{background:#7c5b00;color:#fff;text-align:center;font-size:13px;padding:6px}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
</style>
</head>
<body>
<div class="off-line" id="offl" hidden>Geen internet. Je ziet de laatst bekende gegevens.</div>
<header class="top"><div class="in"><div class="brand"><img src="../icons/icon-192.png" alt=""><span>OG Vorselaar · voor ouders</span></div>
  <h1 id="h">OGV <span>Ouders</span></h1><p id="sub">Even laden…</p><div class="kids" id="kids"></div></div></header>
<main class="wrap" id="list"><div class="sk"></div><div class="sk"></div></main>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button type="button" data-v="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Agenda</button>
  <button type="button" data-v="berichten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/></svg>Berichten<span class="bd" id="bdm" hidden></span></button>
  <button type="button" data-v="gegevens"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Gegevens</button>
</div></nav>
<script src="../tactiekbord/vendor/supabase-2.118.0.js"></script>
<script>
"use strict";
/* OGV Ouders — de app voor ouders. Geen account nodig: elke speler heeft een persoonlijke link van de trainer.
   Open je de link van een tweede kind, dan komt dat kind er gewoon bij. Alles blijft op dit toestel bewaard. */
const SB_URL = "https://intswyovpwiigdwmgjfz.supabase.co", SB_KEY = "sb_publishable_mGTwxXL1HjKgnJcgSATtxQ_6CvHJ-3W";
const demo = /[?&]demo\b/.test(location.search), KK = demo ? "ogv-ouders-kids-demo" : "ogv-ouders-kids", CK = KK + "-cache", SEEN = KK + "-seen";
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const WHY = ["Ziek", "Geblesseerd", "Andere activiteit", "Op reis"], COL = ["#FFD500", "#38BDF8", "#F472B6", "#4ADE80", "#A78BFA"];
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let sb = null, kids = store.get(KK, []), data = {}, view = "agenda", only = null;

/* ---------- gegevens ophalen en bewaren (demo leest de demo van het trainersplatform in deze browser) ---------- */
const DK = "ogv-platform-demo-v2", dget = () => store.get(DK, null), dput = d => store.set(DK, d);
async function fetchKid(tok) {
  if (demo) { const d = dget(), p = d?.players?.find(x => x.parent_token === tok); if (!p) return null;
    const today = new Date().toISOString().slice(0, 10), lim = new Date(Date.now() + 42 * 864e5).toISOString().slice(0, 10);
    return { player: p.first_name, team: d.teams.find(t => t.id === p.team_id)?.name, contacts: p.contacts || [], medical: p.medical || null, consent: p.consent || null, updated: p.parent_updated || null,
      events: d.events.filter(e => e.team_id === p.team_id && e.date >= today && e.date <= lim).sort((a, b) => (a.date + (a.start_time || "")).localeCompare(b.date + (b.start_time || ""))).map(e => { const r = (d.rsvp || []).find(x => x.event_id === e.id && x.player_id === p.id);
        return { id: e.id, type: e.type, date: e.date, start: (e.start_time || "").slice(0, 5), end: (e.end_time || "").slice(0, 5), location: e.location, opponent: e.opponent, home: e.home, state: e.cancelled ? "afgelast" : e.rbfa_state,
          convo: e.convo && e.convo.sent ? { selected: (e.convo.players || []).includes(p.id), meet: e.convo.meet, place: e.convo.place, bring: e.convo.bring, note: e.convo.note } : null, rsvp: r?.status || null, note: r?.note || null }; }),
      messages: (d.messages || []).filter(m => !m.team_id || m.team_id === p.team_id).sort((a, b) => String(b.created_at).localeCompare(String(a.created_at))).slice(0, 8).map(m => ({ title: m.title, body: m.body, author: m.author, date: String(m.created_at).slice(0, 10), club: !m.team_id })) }; }
  const { data: x, error } = await sb.rpc("parent_view", { tok }); if (error) throw error; return x;
}
async function answer(tok, ev, st, msg) {
  if (demo) { const d = dget(), p = d.players.find(x => x.parent_token === tok); d.rsvp = (d.rsvp || []).filter(x => !(x.event_id === ev && x.player_id === p.id));
    if (st) d.rsvp.push({ event_id: ev, player_id: p.id, team_id: p.team_id, status: st, note: msg || null, updated_at: new Date().toISOString() }); dput(d); return true; }
  const { data: x, error } = await sb.rpc("parent_rsvp", { tok, ev, st, msg: msg || null }); if (error) throw error; return x;
}
async function saveProfile(tok, c, med, cons) {
  if (demo) { const d = dget(), p = d.players.find(x => x.parent_token === tok); Object.assign(p, { contacts: c, medical: med || null, consent: { ...cons, date: new Date().toISOString() }, parent_updated: new Date().toISOString() }); dput(d); return true; }
  const { data: x, error } = await sb.rpc("parent_update", { tok, c, med: med || null, cons }); if (error) throw error; return x;
}
async function load() {
  const cache = store.get(CK, {}); let offline = false;
  await Promise.all(kids.map(async k => { try { const x = await fetchKid(k.tok); if (x) { data[k.tok] = x; k.name = x.player; k.team = x.team; cache[k.tok] = x; } else { data[k.tok] = null; } }
    catch (e) { offline = true; if (cache[k.tok]) data[k.tok] = cache[k.tok]; } }));
  store.set(CK, cache); store.set(KK, kids); $("#offl").hidden = !offline;
}

/* ---------- weergave ---------- */
const dayFmt = s => new Date(s + "T12:00:00");
const kidCol = tok => COL[Math.max(0, kids.findIndex(k => k.tok === tok)) % COL.length];
function header() {
  const ok = kids.filter(k => data[k.tok]);
  $("#h").innerHTML = ok.length === 1 ? `Komt ${esc(ok[0].name)}<span>?</span>` : `OGV <span>Ouders</span>`;
  $("#sub").textContent = ok.length === 1 ? `${ok[0].team || ""}` : ok.length ? `${ok.length} kinderen bij OG Vorselaar` : "";
  $("#kids").innerHTML = ok.length > 1 ? `<button type="button" data-k="" aria-pressed="${!only}">Iedereen</button>` + ok.map(k => `<button type="button" data-k="${k.tok}" aria-pressed="${only === k.tok}"><span class="dot" style="--c:${kidCol(k.tok)}"></span>${esc(k.name)}</button>`).join("") : "";
  $$("[data-k]").forEach(b => b.onclick = () => { only = b.dataset.k || null; draw(); });
  const unseen = msgsAll().filter(m => !store.get(SEEN, []).includes(m.key)).length, bd = $("#bdm"); bd.hidden = !unseen || view === "berichten"; bd.textContent = unseen;
  $$("[data-v]").forEach(b => b.setAttribute("aria-current", b.dataset.v === view ? "page" : "false"));
}
function msgsAll() { const seen = new Set(), out = [];
  for (const k of kids) for (const m of (data[k.tok]?.messages || [])) { const key = m.date + "|" + m.title; if (seen.has(key)) continue; seen.add(key); out.push({ ...m, key, kid: m.club ? null : k }); }
  return out.sort((a, b) => b.date.localeCompare(a.date)); }
function installCard() {
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone; if (standalone || store.get("ogv-ouders-noinstall", false)) return "";
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<div class="install" id="inst"><img src="../icons/icon-192.png" alt=""><div><b>Zet OGV Ouders op je beginscherm</b><p>${ios ? "Tik in Safari op de deelknop en kies <b>Zet op beginscherm</b>." : deferred ? `<button class="btn" type="button" id="instb" style="min-height:38px;margin-top:6px">Installeren</button>` : "Open het menu ⋮ van je browser en kies <b>App installeren</b> of <b>Toevoegen aan startscherm</b>."} Dan open je alles met één tik.</p></div><button class="x" type="button" id="instx" aria-label="Sluiten">✕</button></div>`;
}
function evCard(e, k) {
  const d = dayFmt(e.date), cancel = e.state === "afgelast", cv = e.convo, out = cv && !cv.selected, n = k.name, multi = kids.filter(x => data[x.tok]).length > 1;
  const title = e.type === "wedstrijd" ? `${e.opponent ? (e.home === false ? "Uit bij " : "Thuis tegen ") + esc(e.opponent) : "Wedstrijd"}` : "Training";
  const maps = e.location ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.location.split(" · ").pop())}" target="_blank" rel="noopener">${esc(e.location)}</a>` : "";
  return `<article class="ev${cancel ? " cancel" : ""}" data-e="${e.id}" data-t="${k.tok}"><div class="date"><small>${d.toLocaleDateString("nl-BE", { weekday: "short" })}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString("nl-BE", { month: "short" })}</small></div>
    <div class="t">${multi ? `<span class="tag kid"><span class="dot" style="--c:${kidCol(k.tok)}"></span> ${esc(n)}</span>` : ""}${e.type === "wedstrijd" ? '<span class="tag match">Wedstrijd</span>' : ""}${cancel ? "Afgelast · " : ""}${title}</div>
    <div class="m">${e.start ? e.start + (e.end ? "–" + e.end : "") : "Uur volgt"}${maps ? " · " + maps : ""}</div>
    ${cv && !cancel ? (cv.selected ? `<div class="convo"><b>✅ ${esc(n)} is geselecteerd</b>${cv.meet ? `<span>Verzamelen om <b>${esc(cv.meet)}</b>${cv.place ? " · " + esc(cv.place) : ""}</span>` : ""}${cv.bring ? `<span>Meebrengen: ${esc(cv.bring)}</span>` : ""}${cv.note ? `<span>${esc(cv.note)}</span>` : ""}</div>`
      : `<div class="convo off"><b>${esc(n)} is deze keer niet geselecteerd.</b><span>Volgende keer weer! Vragen? Spreek de trainer gerust aan.</span></div>`) : ""}
    ${cancel || out ? "" : `<div class="act"><button type="button" class="ja" aria-pressed="${e.rsvp === "ja"}">${esc(n)} komt</button><button type="button" class="nee" aria-pressed="${e.rsvp === "nee"}">Komt niet</button></div>
    <div class="why"${e.rsvp === "nee" ? "" : " hidden"}>${WHY.map(w => `<button type="button" data-w="${w}" aria-pressed="${e.note === w}">${w}</button>`).join("")}<input placeholder="Of schrijf een korte reden" maxlength="200" value="${esc(WHY.includes(e.note) ? "" : e.note || "")}"></div>`}
    <div class="foot2"><span class="state" aria-live="polite">${!cancel && e.rsvp ? "Doorgegeven aan de trainer." : ""}</span>${cancel ? "" : `<button class="ics" type="button" data-ics>In mijn agenda</button>`}</div></article>`;
}
function drawAgenda() {
  const rows = []; for (const k of kids) { if (only && k.tok !== only) continue; for (const e of (data[k.tok]?.events || [])) rows.push({ e, k }); }
  rows.sort((a, b) => (a.e.date + (a.e.start || "")).localeCompare(b.e.date + (b.e.start || "")));
  const latest = msgsAll()[0], fresh = latest && !store.get(SEEN, []).includes(latest.key);
  $("#list").innerHTML = installCard() + (fresh ? `<div class="note" data-go="berichten"><small>Nieuw bericht · tik om te lezen</small><b>${esc(latest.title)}</b></div>` : "") +
    (rows.length ? rows.map(r => evCard(r.e, r.k)).join("") : `<div class="msg"><b>Niets gepland</b>De komende zes weken staan er nog geen trainingen of wedstrijden in de kalender.</div>`) +
    `<p class="foot">Deze app is persoonlijk. Stuur de link van je kind niet door.</p>`;
  bindInstall(); const nb = $("[data-go]"); if (nb) nb.onclick = () => { view = "berichten"; draw(); };
  $$(".ev[data-e]").forEach(card => {
    const k = kids.find(x => x.tok === card.dataset.t), e = (data[k.tok]?.events || []).find(x => x.id === card.dataset.e), st = card.querySelector(".state");
    const ics = card.querySelector("[data-ics]"); if (ics) ics.onclick = () => icsFor(e, k);
    const btns = card.querySelectorAll(".act button"); if (!btns.length) return;
    const save = async (status, note) => { st.textContent = "Bewaren…";
      try { const ok = await answer(k.tok, e.id, status, note); if (!ok) throw new Error();
        e.rsvp = status; e.note = note || null; const c = store.get(CK, {}); if (c[k.tok]) { c[k.tok] = data[k.tok]; store.set(CK, c); }
        st.textContent = status === "ja" ? "Doorgegeven: komt." : status === "nee" ? "Doorgegeven: komt niet." : "Antwoord gewist."; }
      catch (x) { st.textContent = "Bewaren lukte niet. Controleer je internet en probeer opnieuw."; } };
    const [bj, bn] = btns, why = card.querySelector(".why"), inp = why.querySelector("input");
    bj.onclick = () => { const on = e.rsvp !== "ja"; bj.setAttribute("aria-pressed", on); bn.setAttribute("aria-pressed", false); why.hidden = true; save(on ? "ja" : null, null); };
    bn.onclick = () => { const on = e.rsvp !== "nee"; bn.setAttribute("aria-pressed", on); bj.setAttribute("aria-pressed", false); why.hidden = !on; save(on ? "nee" : null, on ? e.note : null); };
    why.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { const on = b.getAttribute("aria-pressed") !== "true"; why.querySelectorAll("[data-w]").forEach(x => x.setAttribute("aria-pressed", x === b && on)); inp.value = ""; save("nee", on ? b.dataset.w : null); });
    let t; inp.oninput = () => { why.querySelectorAll("[data-w]").forEach(x => x.setAttribute("aria-pressed", false)); clearTimeout(t); t = setTimeout(() => save("nee", inp.value.trim()), 700); };
  });
}
function drawMessages() {
  const ms = msgsAll().filter(m => !only || !m.kid || m.kid.tok === only);
  $("#list").innerHTML = `<h2>Berichten</h2>` + (ms.length ? ms.map(m => `<div class="note"><small>${m.club ? "Van de club" : "Van de trainer van " + esc(m.kid?.name || "")}${m.author ? " · " + esc(m.author) : ""} · ${dayFmt(m.date).toLocaleDateString("nl-BE", { day: "numeric", month: "short" })}</small><b>${esc(m.title)}</b>${m.body ? `<p>${esc(m.body).replace(/\n/g, "<br>")}</p>` : ""}</div>`).join("")
    : `<div class="msg"><b>Geen berichten</b>Nieuws van de club en de trainer verschijnt hier.</div>`);
  store.set(SEEN, [...new Set([...store.get(SEEN, []), ...ms.map(m => m.key)])].slice(-200));
}
function drawProfile() {
  const list = kids.filter(k => data[k.tok] && (!only || k.tok === only));
  $("#list").innerHTML = `<h2>Gegevens</h2><p style="margin:0;color:var(--muted);font-size:14.5px">Zo kan de trainer je bereiken, bv. bij een blessure. Alleen de trainers van de ploeg zien dit.</p>` + list.map(k => { const x = data[k.tok], cs = (x.contacts || []).slice(0, 2); while (cs.length < 2) cs.push({}); const c = x.consent || {};
    return `<form class="card" data-pf="${k.tok}"><h3>${esc(k.name)} <span style="color:var(--muted);font-weight:500;font-size:15px">· ${esc(x.team || "")}</span></h3>
      ${cs.map((ct, i) => `<div class="ct"><b>${i ? "Tweede contactpersoon" : "Contactpersoon"}</b><div class="grid"><label class="f">Naam<input name="n${i}" value="${esc(ct.name || "")}" autocomplete="name"></label>
        <label class="f">Relatie<select name="r${i}">${["", "Mama", "Papa", "Voogd", "Grootouder", "Andere"].map(r => `<option${r === (ct.rel || "") ? " selected" : ""}>${r}</option>`).join("")}</select></label>
        <label class="f">Gsm<input name="p${i}" type="tel" inputmode="tel" value="${esc(ct.phone || "")}" autocomplete="tel"></label><label class="f">E-mail<input name="e${i}" type="email" value="${esc(ct.email || "")}" autocomplete="email"></label></div></div>`).join("")}
      <div class="ct"><label class="f">Medische aandachtspunten (allergie, medicatie, astma…)<textarea name="med" placeholder="Leeg laten als er niets is">${esc(x.medical || "")}</textarea></label></div>
      <div class="ct"><b>Foto's en video's</b>
        <label class="chk"><input type="checkbox" name="ca"${c.analysis ? " checked" : ""}><span>De trainer mag beelden van ${esc(k.name)} maken om met de ploeg te analyseren. Ze blijven in de app van de club.</span></label>
        <label class="chk"><input type="checkbox" name="cp"${c.public ? " checked" : ""}><span>De club mag foto's waarop ${esc(k.name)} herkenbaar is gebruiken op de website en sociale media.</span></label>
        <label class="f" style="margin-top:10px">Naam van de ouder die dit invult<input name="cn" value="${esc(c.name || "")}"></label></div>
      <div class="row"><button class="btn" type="submit">Bewaren</button><span class="ok" data-ok>${x.updated ? "Laatst bijgewerkt " + new Date(x.updated).toLocaleDateString("nl-BE", { day: "numeric", month: "short" }) : ""}</span></div>
      <p style="margin:14px 0 0;font-size:13px;color:var(--muted)">Je kan dit altijd aanpassen of laten wissen. Meer uitleg in de privacyverklaring van de club.</p></form>`; }).join("") +
    `<div class="card"><h3>Nog een kind bij OG Vorselaar?</h3><p class="h" style="margin:0">Open de persoonlijke link die je van de trainer van dat kind kreeg. Het komt er dan vanzelf bij in deze app.</p>
      <div class="row">${kids.map(k => `<button class="btn ghost" type="button" data-rm="${k.tok}" style="min-height:38px;font-size:14px">${esc(k.name || "Kind")} van dit toestel halen</button>`).join("")}</div></div>`;
  $$("[data-pf]").forEach(f => f.onsubmit = async ev => { ev.preventDefault(); const tok = f.dataset.pf, F = f.elements, ok = f.querySelector("[data-ok]");
    const c = [0, 1].map(i => ({ name: F["n" + i].value.trim(), rel: F["r" + i].value, phone: F["p" + i].value.trim(), email: F["e" + i].value.trim() })).filter(x => x.name || x.phone || x.email);
    const cons = { analysis: F.ca.checked, public: F.cp.checked, name: F.cn.value.trim() };
    ok.textContent = "Bewaren…";
    try { if (!await saveProfile(tok, c, F.med.value.trim(), cons)) throw new Error(); Object.assign(data[tok], { contacts: c, medical: F.med.value.trim() || null, consent: cons, updated: new Date().toISOString() }); ok.textContent = "Bewaard. Bedankt!"; }
    catch (x) { ok.textContent = "Bewaren lukte niet. Controleer je internet."; } });
  $$("[data-rm]").forEach(b => b.onclick = () => { if (!confirm("Dit kind van dit toestel halen? Met de link van de trainer kan je het later opnieuw toevoegen.")) return;
    kids = kids.filter(k => k.tok !== b.dataset.rm); store.set(KK, kids); const c = store.get(CK, {}); delete c[b.dataset.rm]; store.set(CK, c); only = null; start(); });
}
function draw() { header(); ({ agenda: drawAgenda, berichten: drawMessages, gegevens: drawProfile }[view])(); header(); scrollTo(0, 0); }

/* ---------- in de agenda van je gsm ---------- */
function icsFor(e, k) {
  const d = e.date.replace(/-/g, ""), t = s => (s || "").replace(":", "") + "00", end = e.end || (e.start ? String(Math.min(23, +e.start.slice(0, 2) + (e.type === "wedstrijd" ? 2 : 1))).padStart(2, "0") + e.start.slice(2) : "");
  const title = (e.type === "wedstrijd" ? (e.home === false ? "Uit bij " : "Thuis tegen ") + (e.opponent || "") : "Training") + " – " + k.name;
  const cv = e.convo && e.convo.selected && e.convo.meet ? "Verzamelen om " + e.convo.meet + (e.convo.place ? " – " + e.convo.place : "") : "";
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//OG Vorselaar//OGV Ouders//NL", "BEGIN:VEVENT", "UID:" + e.id + "-" + k.tok.slice(0, 8) + "@ogv", "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z",
    e.start ? "DTSTART:" + d + "T" + t(e.start) : "DTSTART;VALUE=DATE:" + d, e.start ? "DTEND:" + d + "T" + t(end) : "", "SUMMARY:" + title.replace(/[,;]/g, " "), e.location ? "LOCATION:" + e.location.replace(/[,;]/g, " ") : "", cv ? "DESCRIPTION:" + cv.replace(/[,;]/g, " ") : "", "END:VEVENT", "END:VCALENDAR"].filter(Boolean).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([L], { type: "text/calendar" })); a.download = "ogv-" + e.date + ".ics"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* ---------- installeren ---------- */
let deferred = null;
addEventListener("beforeinstallprompt", ev => { ev.preventDefault(); deferred = ev; if (view === "agenda" && $("#inst")) draw(); });
function bindInstall() { const x = $("#instx"); if (x) x.onclick = () => { store.set("ogv-ouders-noinstall", true); $("#inst").remove(); };
  const b = $("#instb"); if (b) b.onclick = async () => { deferred.prompt(); await deferred.userChoice; deferred = null; $("#inst")?.remove(); }; }

/* ---------- opstarten ---------- */
function fail(title, text) { $("#h").innerHTML = `OGV <span>Ouders</span>`; $("#sub").textContent = ""; $("#tabs").hidden = true; $("#list").innerHTML = `<div class="msg"><b>${title}</b>${text}</div>`; }
async function start() {
  if (!kids.length) { fail("Open de link van de trainer", "Je kreeg van de trainer een persoonlijke link voor je kind. Open die link één keer; daarna vind je alles terug in deze app."); return; }
  await load();
  const bad = kids.filter(k => data[k.tok] === null); if (bad.length) { kids = kids.filter(k => data[k.tok] !== null); store.set(KK, kids); }
  if (!kids.length) { fail("Deze link werkt niet meer", "De trainer heeft misschien een nieuwe link gemaakt. Vraag hem om de juiste link."); return; }
  $("#tabs").hidden = false; draw();
}
$$("[data-v]").forEach(b => b.onclick = () => { view = b.dataset.v; draw(); });
(async () => {
  const tok = decodeURIComponent(location.hash.slice(1)).trim();
  if (tok) { if (!/^[0-9a-f-]{36}$/i.test(tok)) { fail("Deze link is niet volledig", "Open de link precies zoals de trainer hem stuurde, of vraag de trainer om een nieuwe."); return; }
    if (!kids.some(k => k.tok === tok)) kids.push({ tok, name: "", team: "" }); store.set(KK, kids); only = null;
    history.replaceState(null, "", location.pathname + location.search); } /* de code niet in de adresbalk laten staan */
  if (!demo) { if (!window.supabase) { const c = store.get(CK, {}); kids.forEach(k => data[k.tok] = c[k.tok]); if (kids.some(k => data[k.tok])) { $("#offl").hidden = false; $("#tabs").hidden = false; draw(); } else fail("Geen verbinding", "Controleer je internetverbinding en probeer opnieuw."); return; }
    sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: "ogv_ouder" } }); }
  await start();
  if ("serviceWorker" in navigator && !demo) navigator.serviceWorker.register("sw.js").catch(() => {});
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && kids.length) load().then(draw); });
})();
</script>
</body>
